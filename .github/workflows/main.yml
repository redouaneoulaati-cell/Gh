name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create APK folder
        run: mkdir -p apk

      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: web-files
          path: .
