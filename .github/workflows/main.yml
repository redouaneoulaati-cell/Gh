name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Préparer l'application Web
        run: |
          chmod +x prepare-web.sh
          ./prepare-web.sh

      - name: Vérifier la préparation Web
        run: |
          test -f www/index.html
          test -f www/app.js
          test -f www/styles.css
          echo "Dossier www correctement créé"

      - name: Ajouter Android à Capacitor
        run: npx cap add android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Construire APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Francais-au-lycee-Maroc-V8-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
