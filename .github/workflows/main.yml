name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Télécharger le projet
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Installer Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Installer Android SDK
      - name: Setup Android
        uses: android-actions/setup-android@v3

      # 5. Installer les dépendances
      - name: Install dependencies
        run: npm install

      # 6. Préparer les fichiers web
      - name: Prepare web files
        run: |
          chmod +x prepare-web.sh
          ./prepare-web.sh

      # 7. Installer Capacitor Android si nécessaire
      - name: Install Capacitor Android
        run: npm install @capacitor/android

      # 8. Créer Android si le dossier n'existe pas
      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # 9. Synchroniser Capacitor
      - name: Capacitor sync
        run: npx cap sync android

      # 10. Préparer Gradle
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 11. Construire l'APK
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      # 12. Créer le dossier APK
      - name: Create APK folder
        run: mkdir -p apk

      # 13. Copier l'APK
      - name: Copy APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             apk/Francais-au-lycee-Maroc-V8.apk

      # 14. Vérifier que l'APK existe
      - name: Verify APK
        run: |
          ls -lh apk/Francais-au-lycee-Maroc-V8.apk

      # 15. Télécharger l'APK depuis GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Francais-au-lycee-Maroc-V8-APK
          path: apk/Francais-au-lycee-Maroc-V8.apk
          if-no-files-found: error
